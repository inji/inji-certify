GetCredentialForPreAuthCodeEccR1:
   InjiCertify_GetCredentialForPreAuthCode_EccR1_IdpAccessToken_Sign_ES256_Reuse_Proof_Jwt_First_Use_Valid:
      endPoint: $INJICERTIFYBASEURL$/v1/certify/issuance/credential
      uniqueIdentifier: TC_InjiCertify_GetCredentialForPreAuthCodeEccR1Siganture_01
      description: Get credential for the Academic (University, pre-authorized code with Keycloak authentication) use case using a proof_jwt signed with the r1 curve that is cached for reuse, first use should succeed
      role: noauth
      checkErrorsOnlyInResponse: true
      restMethod: post
      inputTemplate: injicertify/EccR1/GetCredentialForPreAuthCodeEccR1/GetCredentialForPreAuthCodeEccR1
      outputTemplate: injicertify/EccR1/GetCredentialForPreAuthCodeEccR1/GetCredentialForPreAuthCodeEccR1Result
      input: '{
      	"client_id": "",
        "idpAccessToken": "$ID:TokenExchange_preauthcode_Valid_Smoke_sid_access_token$",
        "c_nonce": "$ID:PreAuthCode_GenerateNonce_StatusCode_Valid_Smoke_sid_c_nonce$",
        "credential_configuration_id": "UniversityCredential",
      	"proof_type": "jwt",
        "proof_jwt": "$PROOF_JWT_ES256_REUSED$",
        "credentialType": "UniversityCredential",
        "signatureSupported": "ES256"
}'
      output: '{
}'

   InjiCertify_GetCredentialForPreAuthCode_EccR1_IdpAccessToken_Sign_ES256_Reuse_Proof_Jwt_Second_Use_Valid:
