## ------------------------------------------- Plugin enable properties ------------------------------------------------------------
mosip.certify.integration.scan-base-package=io.mosip.certify.mock.integration
mosip.certify.integration.audit-plugin=LoggerAuditService
# Certify builds and signs the mDL itself (DataProvider mode); the plugin only supplies the holder's data.
mosip.certify.integration.data-provider-plugin=MockCSVDataProviderPlugin
mosip.certify.plugin-mode=DataProvider

##commons
mosip.certify.status-list.signature-crypto-suite=Ed25519Signature2018

## ------------------------------------------- Plugin specific usecase properties ------------------------------------------------------------
# Mandatory in DataProvider mode, but not used for mso_mdoc: the mDL is verified with the certificate in issuerAuth's x5chain.
mosip.certify.data-provider-plugin.did-url=did:web:inji.github.io:inji-config:dev-int-inji:mock-mdl
## CSV specific config: the driving licence data, one row per holder, matched on the token's sub
mosip.certify.mock.data-provider.csv.identifier-column=id
mosip.certify.mock.data-provider.csv.data-columns=id,givenName,familyName,birthDate,documentNumber,issueDate,expiryDate,portrait,drivingPrivileges
mosip.certify.mock.data-provider.csv-registry-uri=/home/mosip/config/driving_license_data.csv

## ------------------------------------------- Host values of connected services ------------------------------------------------------------
mosip.injicertify.mock.host=localhost:8090
mosip.api.public.host=api.collab.mosip.net

## ------------------------------------------- UseCase specific default overriding properties ------------------------------------------------------------
mosip.certify.domain.url=http://${mosip.injicertify.mock.host}
mosip.certify.identifier=${mosip.certify.domain.url}
mosip.certify.database.name=inji_certify_mock
mosip.certify.credential-config.issuer.display={\
  {\
    'name': 'Transport Department Issuer',\
    'locale': 'en',\
    'logo':{'uri':'https://inji.github.io/inji-config/logos/mosipid-logo.png',\
         'alt_text':'mosip-logo'}\
  }\
}
