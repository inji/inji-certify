## Overrides for the inji-certify-apitestrig helm chart (../../helm/inji-certify-apitestrig).
## Refer to ../../helm/inji-certify-apitestrig/values.yaml for the full list of configurable values.

modules:
  injicertify:
    enabled: true
    image:
      repository: injistack/apitest-inji-certify
      tag: 1.0.0-alpha.1
      pullPolicy: Always

apitestrig:
  configmaps:
    apitestrig:
      authDemoServiceBaseURL: http://authdemo.authdemo
      authDemoServicePort: 80
      authCertsPath: '/home/inji/authcerts'
